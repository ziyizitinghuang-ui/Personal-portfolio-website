<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jade | Contact</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="container nav-container">
      <div class="nav-header">
        <div class="logo">Jade</div>
        <button class="menu-toggle" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
      <nav class="main-nav">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="resume.html">Resume</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
          <li><a href="process.html">Process</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="contact-section mt-3 mb-3">
      <h1 class="text-center page-title mb-3">Get in Touch</h1>

      <div class="contact-grid">
        <!-- Left: Form -->
        <div class="contact-form-wrapper">
          <div class="tape tape-top"></div>
          <h2 class="mb-2">Say Hello</h2>

          <form class="contact-form" action="#" method="POST">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required placeholder="Your Name">
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" required placeholder="Topic of inquiry">
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required placeholder="Hello..."></textarea>
            </div>

            <button type="submit" class="btn btn-submit">Send Message</button>
          </form>
        </div>

        <!-- Right: Spotify -->
        <div class="contact-media-wrapper">
          <div class="tape tape-top"></div>
          <h2 class="mb-2">Currently Listening To</h2>
          <p class="mb-1">
            Music that supports my creative process and helps shape the mood of my work.
          </p>

          <div class="media-container">
            <iframe
              style="border: 0; border-radius: 12px; width: 100%;"
              src="https://open.spotify.com/embed/playlist/678p6if1rgOHAv1LaBWbjN"
              height="450"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy">
            </iframe>

            <div class="spotify-link text-center">
              <a href="https://open.spotify.com/playlist/678p6if1rgOHAv1LaBWbjN"
                 target="_blank"
                 rel="noopener noreferrer"
                 class="btn">
                Open Playlist on Spotify
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      &copy; 2026 Ziting Huang (Jade). All rights reserved.
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
